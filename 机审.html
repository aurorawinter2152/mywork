<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短剧审核详情 · 数美机审原型</title>
<style>
  :root{
    --green:#1BAE84;
    --green-soft:#F2FBF8;
    --text:#303133;
    --text-sub:#606266;
    --text-weak:#909399;
    --line:#DCDFE6;
    --line-light:#EBEEF5;
    --fill-soft:#F5F7FA;
    --danger:#c8362d;
    --danger-bg:#fdeceb;
    --danger-line:#f7d7d4;
    --danger-deep:#a1201a;
    --red-fill:#f8cecc;
    --red-line:#b85450;
    --red-text:#990000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#f0f2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Arial,sans-serif;
    color:var(--text);
    padding:16px 0 40px;
  }

  /* ===== sheet 切换页签 ===== */
  .sheet-bar{
    width:1400px;
    margin:0 auto 12px;
    display:flex;
    align-items:flex-end;
    gap:4px;
    border-bottom:1px solid var(--line);
  }
  .sheet-tab{
    appearance:none;
    border:1px solid var(--line);
    border-bottom:none;
    background:#e9ecef;
    color:var(--text-sub);
    font-family:inherit;
    font-size:13px;
    line-height:1.2;
    padding:9px 18px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
    white-space:nowrap;
  }
  .sheet-tab .hint{color:var(--text-weak);font-size:11px;margin-left:6px;}
  .sheet-tab:hover{background:#eef1f3;}
  .sheet-tab.active{
    background:#fff;
    color:var(--text);
    font-weight:600;
    box-shadow:inset 0 2px 0 var(--green);
  }
  .sheet-tab.active .hint{color:var(--green);}

  /* ===== 画布：窗口不横向滚动，窗口过窄时整体等比缩放适配 ===== */
  .stage-wrap{
    width:1400px;
    margin:0 auto;
    overflow:hidden;
  }
  .stage{
    width:1400px;
    transform-origin:top left;
  }
  .win{
    position:relative;
    width:1400px;
    height:760px;
    background:#fff;
    border:1px solid var(--line);
  }
  .el{position:absolute;}

  /* ===== 标题栏 ===== */
  .titlebar{left:0;top:0;width:1400px;height:34px;background:#fff;border:1px solid var(--line-light);}
  .title-accent{left:14px;top:9px;width:3px;height:16px;background:var(--green);}
  .title{left:24px;top:5px;width:140px;height:24px;font-size:13px;display:flex;align-items:center;}
  .wbtn{top:5px;width:20px;height:24px;font-size:12px;color:var(--text-sub);display:flex;align-items:center;justify-content:center;}

  /* ===== 一级 Tab ===== */
  .tab{top:46px;width:70px;height:30px;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .tab.plain{color:var(--text-sub);}
  .tab.on{background:var(--green);color:#fff;}

  /* ===== 状态 / 操作 ===== */
  .lbl{top:72px;width:60px;height:26px;font-size:12px;display:flex;align-items:center;}
  .btn{
    top:70px;width:96px;height:30px;border-radius:4px;background:var(--green);color:#fff;
    font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .btn .ico{font-size:11px;}

  /* ===== 二级 Tab ===== */
  .stab{top:106px;height:28px;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .stab.plain{color:var(--text-weak);}
  .stab.on{background:var(--green);color:#fff;}
  .divider{left:10px;top:140px;width:1380px;height:1px;background:var(--line);}

  /* ===== 提示横条 ===== */
  .banner{
    left:40px;top:147px;width:690px;
    font-size:13px;line-height:18px;color:var(--danger);
  }
  .banner span{background:var(--danger-bg);}
  .banner .row{margin-bottom:1px;}

  /* ===== 播放器 ===== */
  .player{left:120px;top:190px;width:300px;height:534px;background:#3D3A33;}
  .player-face{
    left:150px;top:390px;width:240px;height:24px;
    font-size:11px;color:#BFB9AE;display:flex;align-items:center;justify-content:center;
  }
  .player-ep{
    left:150px;top:414px;width:240px;height:24px;
    font-size:14px;color:#EFEAE1;display:flex;align-items:center;justify-content:center;
  }
  .progress{left:132px;top:716px;width:30px;height:3px;background:rgba(255,255,255,.6);}

  /* ===== 左侧控制列 ===== */
  .ctl-lbl{left:450px;width:60px;height:26px;font-size:16px;display:flex;align-items:center;}
  .select{
    left:450px;width:76px;height:28px;border:1px solid var(--line);border-radius:4px;
    background:var(--fill-soft);font-size:11px;color:var(--text-sub);
    display:flex;align-items:center;justify-content:space-between;padding:0 8px;
  }

  /* ===== 选集网格（可点击切换）===== */
  .ep{
    width:46px;height:60px;border-radius:5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.25;user-select:none;
  }
  .ep .no{font-size:14px;font-weight:700;color:var(--text);}
  .ep .mark{font-size:14px;font-weight:700;color:#3f3f3f;}
  .ep .dur{font-size:9px;color:var(--text-weak);}
  .ep:hover{background:var(--green-soft);}
  .ep.short{background:var(--red-fill);border:1px solid var(--red-line);}
  .ep.short .no{color:var(--red-text);}
  .ep.short .dur{color:#ff0000;}
  .ep.short:hover{background:#f6c0bd;}
  .ep.sel,.ep.sel:hover{background:var(--green);}
  .ep.sel .no,.ep.sel .mark{color:#fff;}
  .ep.sel .dur{color:#E6F7F1;}
  .ep.sel.short,.ep.sel.short:hover{background:var(--red-fill);border:2px solid var(--green);}
  .ep.sel.short .no{color:var(--red-text);}
  .ep.sel.short .mark{color:#3f3f3f;}
  .ep.sel.short .dur{color:#ff0000;}

  /* ===== 数美机审结果卡片 ===== */
  .mj-lbl{left:452px;top:482px;width:70px;font-size:16px;}
  .mj-card{
    left:544px;top:478px;width:830px;height:256px;
    background:#fff;border:1px solid var(--line-light);border-radius:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .mj-hd{
    flex:none;height:38px;padding:0 12px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--fill-soft);border-bottom:1px solid var(--line-light);
    font-size:13px;
  }
  .mj-hd .t{font-weight:600;}
  .mj-hd .t em{font-style:normal;font-weight:400;color:var(--danger);margin-left:8px;}
  .mj-hd .cur{font-size:12px;color:var(--text-weak);}
  .mj-hd .cur b{color:var(--text);font-weight:600;}
  .mj-hd .cur .ng{color:var(--danger);font-weight:600;}
  .mj-hd .cur .ok{color:var(--green);font-weight:600;}

  /* 明细列表：只竖向滚动，始终展示全部集 */
  .mj-bd{
    position:relative;flex:1;min-height:0;
    overflow-y:scroll;overflow-x:hidden;
    padding:4px 0;
  }
  .mj-bd::-webkit-scrollbar{width:10px;}
  .mj-bd::-webkit-scrollbar-track{background:var(--fill-soft);}
  .mj-bd::-webkit-scrollbar-thumb{
    background:#C6CBD4;border-radius:5px;border:2px solid var(--fill-soft);
  }
  .mj-bd::-webkit-scrollbar-thumb:hover{background:#A8AEB8;}

  .mj-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:8px 12px;border-bottom:1px dashed #F0F2F5;cursor:pointer;
  }
  .mj-row:last-child{border-bottom:none;}
  .mj-row:hover{background:#FAFBFC;}
  .mj-row.on{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green);}
  .mj-row .epno{
    flex:none;width:62px;line-height:22px;text-align:center;
    font-size:12px;font-weight:600;color:var(--danger-deep);
    background:#fde2e0;border-radius:3px;
  }
  .mj-row .items{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:12px;line-height:20px;padding:0 8px;border-radius:3px;white-space:nowrap;
    background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger);
  }

  /* 机审中：静态 loading（无动画） */
  .mj-loading{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  }
  .mj-ring{width:88px;height:88px;border:7px dashed #C6CBD4;border-radius:50%;}
  .mj-loading .txt{font-size:14px;color:var(--text-sub);}
  .mj-loading .sub{font-size:12px;color:var(--text-weak);}
</style>
</head>
<body>

<div class="sheet-bar" id="sheetBar"></div>
<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage"><div class="win" id="win"></div></div>
</div>

<script>
/* ---------- 选集数据：集数 / 机审标记 / 时长 / 标红(时长不足) ---------- */
var EPISODES = [
  [1 ,'❌','1:20',''], [2 ,'✅','1:12',''], [3 ,'✅','1:07',''], [4 ,'❌','1:12',''],
  [5 ,'✅','1:13',''], [6 ,'✅','0:15','short'], [7 ,'✅','2:45',''], [8 ,'✅','2:03',''],
  [9 ,'✅','1:49',''], [10,'✅','2:21',''], [11,'✅','2:25',''], [12,'❌','1:35',''],
  [13,'✅','2:18',''], [14,'✅','2:37',''], [15,'✅','1:46',''], [16,'✅','2:03',''],
  [17,'❌','1:48',''], [18,'✅','1:39',''],
  [19,'✅','1:33',''], [20,'✅','1:24',''], [21,'✅','1:36',''], [22,'✅','1:10',''],
  [23,'✅','1:27',''], [24,'✅','1:26',''], [25,'❌','0:14','short'], [26,'✅','1:37',''],
  [27,'✅','1:33',''], [28,'✅','1:51',''], [29,'✅','2:17',''], [30,'❌','1:48',''],
  [31,'✅','1:48',''], [32,'✅','2:03',''], [33,'✅','1:50',''], [34,'✅','1:28',''],
  [35,'✅','1:47',''], [36,'✅','1:54',''],
  [37,'✅','1:06',''], [38,'✅','1:42',''], [39,'❌','1:51',''], [40,'✅','1:31',''],
  [41,'✅','2:14',''], [42,'✅','2:01',''], [43,'✅','1:50',''], [44,'✅','2:20',''],
  [45,'✅','2:16',''], [46,'✅','1:22',''], [47,'✅','1:51',''], [48,'❌','1:54',''],
  [49,'✅','1:47',''], [50,'✅','1:53','']
];

/* 网格坐标：18 列一行，行 y = 194 / 289 / 377 */
var GRID_X0 = 544, GRID_DX = 46, ROW_Y = [194, 289, 377], COLS = 18;

/* ---------- 违规类型 ---------- */
var V = {
  A: '暴恐 · 暴恐场景 · 重度血腥',
  B: '辱骂 · 人身攻击 · 重度人身攻击',
  C: '辱骂 · 色情粗口 · 性器官辱骂'
};

/* ---------- 各集违规明细：违规类型（机审结果不含时间点） ---------- */
var RISK_DETAIL = {
  1 : ['A','B','C'],
  4 : ['A','B'],
  12: ['B','C','A'],
  17: ['A','C'],
  25: ['C','A'],
  30: ['A','B','C'],
  39: ['B','C'],
  48: ['A','B','C']
};
var RISK_EPS = Object.keys(RISK_DETAIL).map(Number).sort(function(a,b){ return a - b; });

/* ---------- 两个 sheet ---------- */
var SHEETS = [
  {
    name: '机审完成状态',
    hint: '机审完成',
    banner: [
      '⚠ 有 2 集时长不足 25 秒，已标红，请确认是否符合上架要求',
    ],
    result: 'detail'
  },
  {
    name: '机审未完成状态',
    hint: '机审中',
    banner: [
      '⚠ 有 2 集时长不足 25 秒，已标红，请确认是否符合上架要求',
      '⚠ 数美机审处理中，请等待结果'
    ],
    result: 'loading'
  }
];

/* ---------- 当前状态 ---------- */
var state = { sheet: 0, ep: 1 };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- 选集网格 ---------- */
function renderEpisodes(){
  var out = '';
  for (var i = 0; i < EPISODES.length; i++){
    var e = EPISODES[i];
    var col = i % COLS, row = Math.floor(i / COLS);
    var x = GRID_X0 + col * GRID_DX, y = ROW_Y[row];
    var cls = 'el ep' + (e[3] ? ' short' : '') + (e[0] === state.ep ? ' sel' : '');
    out += '<div class="' + cls + '" data-n="' + e[0] + '"' +
                ' style="left:' + x + 'px;top:' + y + 'px" title="第 ' + e[0] + ' 集 · ' + e[2] + '">' +
             '<span class="no">' + e[0] + '</span>' +
             '<span class="mark">' + e[1] + '</span>' +
             '<span class="dur">' + e[2] + '</span>' +
           '</div>';
  }
  return out;
}

/* ---------- 机审结果卡片 ---------- */
function renderDetailRows(){
  return RISK_EPS.map(function(n){
    var items = RISK_DETAIL[n].map(function(k){
      return '<span class="tag">' + esc(V[k]) + '</span>';
    }).join('');
    return '<div class="mj-row" data-ep="' + n + '">' +
             '<span class="epno">第' + n + '集</span>' +
             '<span class="items">' + items + '</span>' +
           '</div>';
  }).join('');
}

function renderResult(kind){
  if (kind === 'loading'){
    return '<div class="el mj-card">' +
             '<div class="mj-hd">' +
               '<span class="t">机审结果</span>' +
               '<span class="cur" id="curEp"></span>' +
             '</div>' +
             '<div class="mj-loading">' +
               '<div class="mj-ring"></div>' +
               '<div class="txt">机审审核中，请稍候</div>' +
               '<div class="sub">完成后将在此展示各集违规明细</div>' +
             '</div>' +
           '</div>';
  }
  return '<div class="el mj-card">' +
           '<div class="mj-hd">' +
             '<span class="t">违规明细<em>共 ' + RISK_EPS.length + ' 集未通过</em></span>' +
             '<span class="cur" id="curEp"></span>' +
           '</div>' +
           '<div class="mj-bd" id="mjBody">' + renderDetailRows() + '</div>' +
         '</div>';
}

/* ---------- 整页渲染 ---------- */
function renderSheet(idx){
  state.sheet = idx;
  var s = SHEETS[idx];
  var banner = s.banner.map(function(t){
    return '<div class="row"><span>' + esc(t) + '</span></div>';
  }).join('');

  document.getElementById('win').innerHTML = [
    /* 标题栏 */
    '<div class="el titlebar"></div>',
    '<div class="el title-accent"></div>',
    '<div class="el title">短剧审核详情</div>',
    '<div class="el wbtn" style="left:1316px">—</div>',
    '<div class="el wbtn" style="left:1344px">⛶</div>',
    '<div class="el wbtn" style="left:1370px">✕</div>',

    /* 一级 Tab */
    '<div class="el tab plain" style="left:12px">短剧信息</div>',
    '<div class="el tab on" style="left:88px">剧集信息</div>',

    /* 状态 / 操作 */
    '<div class="el lbl" style="left:990px">状态:</div>',
    '<div class="el lbl" style="left:1100px">操作:</div>',
    '<div class="el btn" style="left:1146px"><span class="ico">✎</span>短剧评级</div>',
    '<div class="el btn" style="left:1252px"><span class="ico">▤</span>操作记录</div>',

    /* 二级 Tab */
    '<div class="el stab on" style="left:10px;width:56px">成片</div>',
    '<div class="el stab plain" style="left:70px;width:80px">无字幕视频</div>',
    '<div class="el stab plain" style="left:154px;width:62px">字幕srt</div>',
    '<div class="el stab plain" style="left:220px;width:50px">音轨</div>',
    '<div class="el divider"></div>',

    /* 提示横条 */
    '<div class="el banner">' + banner + '</div>',

    /* 播放器 */
    '<div class="el player"></div>',
    '<div class="el player-face">（视频画面）</div>',
    '<div class="el player-ep" id="playerEp"></div>',
    '<div class="el progress"></div>',

    /* 控制列 */
    '<div class="el ctl-lbl" style="top:206px">选集</div>',
    '<div class="el ctl-lbl" style="top:240px">速度</div>',
    '<div class="el select" style="top:270px"><span>正常</span><span>⌄</span></div>',
    '<div class="el ctl-lbl" style="top:310px">全屏</div>',
    '<div class="el select" style="top:340px"><span>普通</span><span>⌄</span></div>',

    /* 选集网格 */
    renderEpisodes(),

    /* 机审结果 */
    '<div class="el mj-lbl">数美机审:</div>',
    renderResult(s.result)
  ].join('');

  var tabs = document.querySelectorAll('.sheet-tab');
  for (var i = 0; i < tabs.length; i++){
    tabs[i].classList.toggle('active', i === idx);
  }

  selectEp(state.ep);
}

/* ---------- 切换集：明细列表始终保留全部集，只做高亮与定位 ---------- */
function selectEp(n){
  state.ep = n;

  var cells = document.querySelectorAll('.ep');
  for (var i = 0; i < cells.length; i++){
    cells[i].classList.toggle('sel', Number(cells[i].dataset.n) === n);
  }

  var pe = document.getElementById('playerEp');
  if (pe) pe.textContent = '第 ' + n + ' 集';

  updateCur();

  var rows = document.querySelectorAll('.mj-row'), target = null;
  for (var j = 0; j < rows.length; j++){
    var on = Number(rows[j].dataset.ep) === n;
    rows[j].classList.toggle('on', on);
    if (on) target = rows[j];
  }

  /* 把当前集的明细滚进可视区，其余集仍在列表里，可继续上下拉 */
  var bd = document.getElementById('mjBody');
  if (bd && target){
    var top = target.offsetTop, bottom = top + target.offsetHeight;
    if (top < bd.scrollTop) bd.scrollTop = top;
    else if (bottom > bd.scrollTop + bd.clientHeight) bd.scrollTop = bottom - bd.clientHeight;
  }
}

function updateCur(){
  var el = document.getElementById('curEp');
  if (!el) return;
  var e = EPISODES[state.ep - 1];
  var html = '当前：<b>第 ' + state.ep + ' 集</b>';
  if (SHEETS[state.sheet].result === 'loading'){
    html += ' · 机审中';
  } else {
    var pass = e[1] === '✅';
    html += ' · <span class="' + (pass ? 'ok' : 'ng') + '">' +
            (pass ? '已通过机审' : '未通过机审') + '</span>';
  }
  el.innerHTML = html;
}

/* ---------- 交互绑定 ---------- */
document.getElementById('win').addEventListener('click', function(ev){
  var cell = ev.target.closest('.ep');
  if (cell){ selectEp(Number(cell.dataset.n)); return; }
  var row = ev.target.closest('.mj-row');
  if (row) selectEp(Number(row.dataset.ep));
});

document.getElementById('sheetBar').innerHTML = SHEETS.map(function(s, i){
  return '<button class="sheet-tab' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
           esc(s.name) + '<span class="hint">' + esc(s.hint) + '</span>' +
         '</button>';
}).join('');

document.getElementById('sheetBar').addEventListener('click', function(ev){
  var btn = ev.target.closest('.sheet-tab');
  if (btn) renderSheet(Number(btn.dataset.i));
});

/* ---------- 窗口过窄时整体等比缩小，不出现横向滚动条 ---------- */
var WIN_W = 1400, WIN_H = 760;

function fitStage(){
  var wrap  = document.getElementById('stageWrap');
  var stage = document.getElementById('stage');
  var bar   = document.getElementById('sheetBar');

  var avail = document.documentElement.clientWidth - 32;   // 左右各留 16px
  var scale = Math.min(1, avail / WIN_W);

  stage.style.transform = 'scale(' + scale + ')';
  wrap.style.width  = (WIN_W * scale) + 'px';
  wrap.style.height = (WIN_H * scale) + 'px';
  bar.style.width   = (WIN_W * scale) + 'px';
}

window.addEventListener('resize', fitStage);

renderSheet(0);
fitStage();
</script>

</body>
</html>
